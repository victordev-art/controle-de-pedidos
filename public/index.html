<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Controle de Pedidos</title>
<style>
:root{--bg:#eceff1;--card:#fff;--tx:#18222d;--mut:#66727f;--bd:#d5dbe1;--pri:#164c8a;--onpri:#fff;--tm:#8a5200;--tmbg:#fff3dc;--ok:#17703f;--bad:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#141a21;--card:#1d252e;--tx:#e8edf2;--mut:#93a0ad;--bd:#33404d;--pri:#5b9be6;--onpri:#0c1622;--tm:#ffc766;--tmbg:#3a2c10;--ok:#5fd08e;--bad:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 "Segoe UI",system-ui,Roboto,Arial,sans-serif}
header,main{max-width:1000px;margin:auto;padding:16px}
header{padding-bottom:0}
h1{font-size:22px;margin:0 0 4px}
#sync{font-size:13px;color:var(--mut);margin-bottom:10px}
#sync.err{color:var(--bad)}
nav{display:flex;gap:4px;overflow-x:auto;border-bottom:2px solid var(--bd)}
nav button{flex:none;border:0;background:none;color:var(--mut);font:inherit;font-weight:600;padding:10px 14px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
nav button[aria-selected=true]{color:var(--pri);border-color:var(--pri)}
nav .n{background:var(--bd);color:var(--tx);border-radius:9px;padding:0 7px;font-size:12px;margin-left:6px}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:14px;margin-bottom:16px}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;align-items:end}
label{display:grid;gap:4px;font-weight:600;font-size:13px}
input,select{font:inherit;padding:9px;border:1px solid var(--bd);border-radius:4px;background:var(--bg);color:var(--tx);width:100%}
:focus-visible{outline:3px solid var(--pri);outline-offset:1px}
.btn{font:inherit;font-weight:600;border:0;border-radius:4px;padding:10px 14px;background:var(--pri);color:var(--onpri);cursor:pointer}
.list{display:grid;gap:10px}
.ord{background:var(--card);border:1px solid var(--bd);border-left:6px solid var(--pri);border-radius:6px;padding:12px 14px;display:grid;gap:8px}
.ord.pago{border-left-color:var(--ok)}
.top{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:baseline;justify-content:space-between}
.num{font-size:20px;font-weight:700}
.meta{color:var(--mut);font-size:13px}
.tags,.times{display:flex;flex-wrap:wrap;gap:6px}
.tag{border:1px solid var(--bd);border-radius:4px;padding:1px 8px;font-size:12px;font-weight:600}
.tag.st{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.tm{background:var(--tmbg);color:var(--tm);border-radius:4px;padding:3px 8px;font-size:13px;font-variant-numeric:tabular-nums}
.empty{color:var(--mut);padding:24px;text-align:center;border:1px dashed var(--bd);border-radius:6px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:4px;display:none}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <h1>Controle de pedidos</h1>
  <div id="sync">Conectando…</div>
  <nav role="tablist" id="tabs"></nav>
</header>
<main>
  <section class="panel" id="p-novo" hidden>
    <form id="form">
      <label>Vendedor<input name="vendedor" required maxlength="40" autocomplete="off"></label>
      <label>Cliente<input name="cliente" required maxlength="60" autocomplete="off"></label>
      <label>Tipo do pedido<select name="tipo"><option value="FATURADO">Faturado (PA)</option><option value="PAGO">Pago na hora (caixa)</option></select></label>
      <label>Saída<select name="entrega"><option value="BALCAO">Balcão (retirada)</option><option value="ENTREGA">Entrega</option></select></label>
      <button class="btn" type="submit">Enviar para o estoque</button>
    </form>
    <p class="meta">Pedidos do DataCar entram sozinhos. Use este formulário só para pedidos fora do sistema.</p>
  </section>
  <section class="panel" id="p-estoque" hidden>
    <label>Estoquista (registrado ao iniciar a separação)
      <select id="estoquista"><option value="">Selecione o estoquista</option></select></label>
  </section>
  <div class="list" id="list"></div>
</main>
<div id="toast" role="status"></div>
<script>
const ABAS = [['caixa','Caixa',['AG_PAG']],['estoque','Estoque',['AG_SEP','SEP']],['expedicao','Expedição',['PRONTO','ROTA']],['todos','Todos',null],['novo','Novo pedido',null]];
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const pad = (n) => String(n).padStart(2,'0');
const fmt = (ms) => { const s = Math.max(0, Math.floor(ms/1000)), h = Math.floor(s/3600), m = Math.floor(s%3600/60); return h ? `${h}h ${pad(m)}min` : `${pad(m)}:${pad(s%60)}`; };
const store = { get:(k)=>{try{return localStorage.getItem(k)||''}catch{return ''}}, set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}} };
let aba = store.get('aba') || 'estoque', pedidos = [], offset = 0, ultimo = '';
const agora = () => Date.now() + offset;

async function api(path, opt) {
  const r = await fetch(path, { headers: {'Content-Type':'application/json'}, ...opt });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.erro || 'Erro ' + r.status);
  return d;
}
function toast(m) { const t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = 'none', 2800); }

const visiveis = (k) => {
  if (k === 'todos') return pedidos;
  if (k === 'novo') return pedidos.filter(o => o.status !== 'FIM');
  const st = ABAS.find(a => a[0] === k)[2];
  return pedidos.filter(o => st.includes(o.status)).sort((a, b) => a.t.criado - b.t.criado); // mais antigo primeiro
};
function botoes(o) {
  const b = (a, t) => `<button class="btn" data-a="${a}" data-id="${o.id}">${t}</button>`;
  if (aba === 'caixa' && o.status === 'AG_PAG') return b('pagar', 'Confirmar pagamento');
  if (aba === 'estoque') { if (o.status === 'AG_SEP') return b('iniciar', 'Iniciar separação'); if (o.status === 'SEP') return b('concluir', 'Concluir separação'); }
  if (aba === 'expedicao') {
    if (o.status === 'PRONTO') return o.entrega === 'ENTREGA' ? b('sair', 'Saiu para rota') : b('finalizar', 'Cliente retirou');
    if (o.status === 'ROTA') return b('finalizar', 'Marcar como entregue');
  }
  return '';
}
function card(o) {
  const tempos = o.cronometros.map(([l, i, f]) => `<span class="tm">${esc(l)}: <span class="cr" data-s="${i}" ${f ? `data-e="${f}"` : ''}>${fmt((f || agora()) - i)}</span></span>`).join('');
  return `<article class="ord ${o.tipo === 'PAGO' ? 'pago' : ''}"><div class="top"><span class="num">Pedido nº ${esc(o.numero)}</span>
    <span class="tags"><span class="tag">${esc(o.tipoLabel)}</span><span class="tag">${esc(o.entregaLabel)}</span><span class="tag">${o.source === 'datacar' ? 'DataCar' : 'Manual'}</span><span class="tag st">${esc(o.statusLabel)}</span></span></div>
    <div class="meta">Cliente: ${esc(o.cliente)} · Vendedor: ${esc(o.vendedor)}${o.estoquista ? ' · Estoquista: ' + esc(o.estoquista) : ''}</div>
    <div class="times">${tempos}</div>${botoes(o)}</article>`;
}
function render() {
  $('#tabs').innerHTML = ABAS.map(([k, n]) => `<button role="tab" data-tab="${k}" aria-selected="${k === aba}">${n}${['novo','todos'].includes(k) ? '' : `<span class="n">${visiveis(k).length}</span>`}</button>`).join('');
  $('#p-novo').hidden = aba !== 'novo'; $('#p-estoque').hidden = aba !== 'estoque';
  const l = visiveis(aba);
  $('#list').innerHTML = l.length ? l.map(card).join('') : '<div class="empty">Nenhum pedido nesta etapa.</div>';
}
async function carregar() {
  try {
    const d = await api('/api/orders'); offset = d.agora - Date.now();
    const s = JSON.stringify(d.pedidos);
    if (s !== ultimo) { ultimo = s; pedidos = d.pedidos; render(); }
  } catch (e) {}
}
async function status() {
  const el = $('#sync');
  try {
    const s = await api('/api/integracao/status');
    el.className = s.lastError ? 'err' : '';
    el.textContent = !s.enabled ? 'DataCar: recebendo pedidos automaticamente por webhook.'
      : s.lastError ? 'DataCar: falha na última consulta — ' + s.lastError
      : s.lastOk ? 'DataCar: última consulta às ' + new Date(s.lastOk).toLocaleTimeString('pt-BR') : 'DataCar: aguardando primeira consulta…';
  } catch { el.className = 'err'; el.textContent = 'Sem conexão com o servidor.'; }
}

$('#tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) { aba = b.dataset.tab; store.set('aba', aba); render(); } });
$('#list').addEventListener('click', async e => {
  const b = e.target.closest('[data-a]'); if (!b) return;
  try { await api(`/api/orders/${b.dataset.id}/${b.dataset.a}`, { method: 'POST', body: JSON.stringify({ estoquista: $('#estoquista').value }) }); ultimo = ''; await carregar(); }
  catch (err) { toast(err.message); if (b.dataset.a === 'iniciar') $('#estoquista').focus(); carregar(); }
});
$('#form').addEventListener('submit', async e => {
  e.preventDefault(); const d = Object.fromEntries(new FormData(e.target));
  try { const o = await api('/api/orders', { method: 'POST', body: JSON.stringify(d) }); store.set('vendedor', d.vendedor); e.target.cliente.value = ''; toast('Pedido nº ' + o.numero + ' enviado.'); ultimo = ''; carregar(); }
  catch (err) { toast(err.message); }
});
api('/api/estoquistas').then(d => {
  const sel = $('#estoquista'), salvo = store.get('estoquista');
  sel.innerHTML = '<option value="">Selecione o estoquista</option>' + d.estoquistas.map(n => `<option>${esc(n)}</option>`).join('');
  if (d.estoquistas.includes(salvo)) sel.value = salvo;
}).catch(() => {});
$('#estoquista').addEventListener('change', e => store.set('estoquista', e.target.value));
$('#form').vendedor.value = store.get('vendedor');

carregar(); status(); render();
setInterval(carregar, 4000); setInterval(status, 10000);
setInterval(() => document.querySelectorAll('.cr:not([data-e])').forEach(el => el.textContent = fmt(agora() - +el.dataset.s)), 1000);
</script>
</body>
</html>
